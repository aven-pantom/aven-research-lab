<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aven Research Portal</title>
  <meta name="description" content="A quiet HTML and Tailwind reader for the Aven Research Lab markdown repository." />
  <link rel="stylesheet" href="styles.css?v=simple-20260725" />
</head>
<body>
  <main class="portal">
    <section class="intro" aria-label="Portal introduction">
      <p class="kicker">Aven Research Lab</p>
      <div class="intro-grid">
        <h1>Research<br />Portal</h1>
        <div class="intro-copy">
          <p>A quiet reader for Vibe Research notes, source material, experiments, rejected paths, and synthesis.</p>
          <div class="meta-line">
            <span><strong id="docCount">—</strong> docs</span>
            <span><strong id="categoryCount">—</strong> sections</span>
            <span>HTML + Tailwind</span>
          </div>
        </div>
      </div>
    </section>

    <section class="tools" aria-label="Search and theme">
      <label class="search-control" for="search">
        <span>Search</span>
        <input id="search" type="search" placeholder="cadence, drones, materials, cameras…" autocomplete="off" />
      </label>
      <div class="theme-toggle" aria-label="Theme">
        <button id="lightMode" type="button">Light</button>
        <button id="darkMode" type="button">Dark</button>
      </div>
    </section>

    <nav id="categories" class="sections" aria-label="Document categories"></nav>

    <section class="workspace">
      <aside class="document-index" aria-label="Documents">
        <div class="index-heading">Index</div>
        <nav id="documents" class="doc-list"></nav>
      </aside>

      <article class="reader">
        <header class="reader-header">
          <div>
            <p class="reader-label">Current document</p>
            <p id="breadcrumb" class="breadcrumb">Loading portal manifest…</p>
          </div>
          <div class="reader-links">
            <a id="rawLink" href="#" target="_blank" rel="noreferrer">Raw MD</a>
            <a id="githubLink" href="#" target="_blank" rel="noreferrer">GitHub</a>
          </div>
        </header>
        <div id="document" class="document loading">Loading…</div>
      </article>
    </section>
  </main>

  <script src="app.js?v=simple-20260725"></script>
</body>
</html>
